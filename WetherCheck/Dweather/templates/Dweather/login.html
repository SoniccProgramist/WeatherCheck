<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
    {% load static %}
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        /* Відео на фон */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Центральний контейнер */
        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            margin-bottom: 40px;
        }

        /* Форма входу */
        .login-container {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            padding: 20px;
            min-width: 300px;
        }

        .login-input {
            padding: 12px 20px;
            border: none;
            outline: none;
            font-size: 18px;
            margin-bottom: 15px;
            background: transparent;
            color: white;
        }

        .login-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .login-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        /* Повідомлення про помилки */
        .error-message {
            color: #ff5555;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-align: left;
        }

        .alt-link {
            color: #00bfff;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-align: center;
        }

        .alt-link:hover {
            text-decoration: underline;
        }

        /* Верхня навігація (тільки логотип/назва) */
        .navbar {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="{% static 'Dweather/images/clouds-bg.webm' %}" type="video/mp4">
        Ваш браузер не підтримує відео.
    </video>

    <div class="navbar">Weather Search</div>

    <div class="content">
        <h1>Вхід</h1>
        <form method="post" class="login-container">
            {% csrf_token %}
            {% for field in form %}
                <input type="{{ field.field.widget.input_type }}"
                       name="{{ field.html_name }}"
                       placeholder="{{ field.label }}"
                       class="login-input"
                       value="{{ field.value|default_if_none:'' }}"
                       required>
                {% if field.errors %}
                    <div class="error-message">{{ field.errors }}</div>
                {% endif %}
            {% endfor %}
            <button type="submit" class="login-btn">Увійти</button>
        </form>
        <a href="{% url 'register' %}" class="alt-link">Ще немає акаунта? Зареєструватися</a>
    </div>
</body>
</html>
